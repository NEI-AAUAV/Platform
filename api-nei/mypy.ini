[mypy]
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = False
check_untyped_defs = True

ignore_missing_imports = True
disallow_untyped_defs = False
strict_equality = True
exclude = ^app/tests/

# SQLAlchemy hybrid-property setters intentionally redeclare the descriptor;
# mypy cannot model that decorator protocol.
[mypy-app.models.*]
disable_error_code = no-redef

# This compatibility helper reads CPython's private zipfile structures. Their
# runtime API is tested, but those private names are intentionally absent from
# typeshed.
[mypy-app.utils]
disable_error_code = attr-defined,assignment,union-attr,arg-type,method-assign

# FastAPI response-model conversion and SQLAlchemy's dynamically generated
# expression/row types are validated by endpoint and migration tests. Keep
# mypy enabled for every other error category in these legacy boundary modules.
[mypy-app.api.api_v1.user]
disable_error_code = arg-type,assignment,return-value,union-attr
[mypy-app.api.api_v1.auth.token]
disable_error_code = assignment,call-arg,var-annotated
[mypy-app.api.api_v1.auth.oidc]
disable_error_code = arg-type,call-arg
[mypy-app.api.api_v1.auth._deps]
disable_error_code = arg-type,union-attr
[mypy-app.crud.crud_user]
disable_error_code = assignment,import-untyped,return-value
[mypy-app.crud.base]
disable_error_code = assignment,attr-defined
[mypy-app.api.api_v1.arraial]
disable_error_code = return-value,var-annotated
[mypy-app.api.api_v1.faina.faina]
disable_error_code = return-value
[mypy-app.api.api_v1.senior.senior_student]
disable_error_code = return-value
[mypy-app.crud.crud_faina_member]
disable_error_code = return-value
[mypy-app.crud.crud_news]
disable_error_code = return-value
[mypy-app.crud.crud_senior]
disable_error_code = return-value
[mypy-app.crud.crud_team_mandate]
disable_error_code = return-value
[mypy-app.api.api_v1.video]
disable_error_code = arg-type
[mypy-app.api.api_v1.news]
disable_error_code = attr-defined
[mypy-app.api.api_v1.note]
disable_error_code = assignment
[mypy-app.api.api_v1.auth]
disable_error_code = truthy-function
[mypy-app.core.dynamic_oauth]
disable_error_code = assignment
[mypy-app.exception]
disable_error_code = assignment,has-type
[mypy-app.schemas.user.user]
disable_error_code = misc

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
warn_untyped_fields = True
