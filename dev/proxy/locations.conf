
# Internal-only: api-tacaua calls this over the docker network, and the
# endpoint is unauthenticated. Keep it off the public proxy.
location = /api/nei/v1/ws/broadcast {
    return 404;
}

location ~ ^/(api|static)/nei(/.*)?$ {
    limit_except GET POST PUT DELETE OPTIONS HEAD {
        deny all;
    }

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    
    proxy_pass http://api_nei_backend;
}

# location ~ ^/(api|static)/tacaua(/.*)?$ {
#     limit_except GET POST PUT DELETE {
#         deny all;
#     }

#     proxy_pass http://api_tacaua:8001;
# }

location ~ ^/(api|static)/family(/.*)?$ {
    limit_except GET POST PUT DELETE OPTIONS HEAD {
        deny all;
    }
    
    # Override global WebSocket upgrade headers (api-family doesn't support WS)
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    
    proxy_pass http://api_family_backend;
}

location / {
    proxy_pass http://web_nei_backend;
}

# Google Drive photos for the history timeline. Mirrors Infrastructure's
# nginx/sites-available/45-drive-images.conf minus the disk cache: browsers
# can't hotlink lh3.googleusercontent.com reliably (Chrome blocks it with
# ERR_BLOCKED_BY_ORB), so photos always go through us.
location ~ "^/drive-img/([A-Za-z0-9_-]{10,}=w(600|2000))$" {
    set $drive_image $1;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    proxy_pass https://lh3.googleusercontent.com/d/$drive_image;
    proxy_ssl_server_name on;
    proxy_set_header Host lh3.googleusercontent.com;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
}
