# Local-only Directus route. Use with compose.directus.yml.
location = /cms {
    return 301 /cms/;
}

# Compatibility route for a previously cached Directus index whose base tag
# still points at /admin/. This can be removed after all local browser caches
# have expired.
location ^~ /admin/ {
    proxy_pass http://directus:8055;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location ^~ /cms/ {
    rewrite ^/cms/(.*)$ /$1 break;
    proxy_pass http://directus:8055;

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 100m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /cms;

    # Directus serves its SPA with a root-relative /admin/ base even when
    # PUBLIC_URL contains /cms/. Rewrite only that base tag so browser asset
    # requests remain inside this proxied prefix.
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '<base href="/admin/" />' '<base href="/cms/admin/" />';
}
