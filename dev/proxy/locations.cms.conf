# Directus CMS routes (nei-directus, separate repo, reached over the
# `nei-shared` external Docker network — see nei-directus/README.md)

location ~ ^/cms(/.*)?$ {
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    rewrite ^/cms(/.*)?$ $1 break;
    proxy_pass http://directus:8055;
}

location = /cms {
    return 301 /cms/;
}
