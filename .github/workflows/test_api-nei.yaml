name: Test api-nei

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test_api-nei.yaml'
      - 'api-nei/**/*'
  pull_request:
    paths:
      - '.github/workflows/test_api-nei.yaml'
      - 'api-nei/**/*'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install "ruff>=0.8,<1.0"

      - name: Lint api-nei
        working-directory: ./api-nei
        run: ruff check app

  api-nei:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: postgres_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install poetry
        run: |
          pip install --upgrade pip setuptools
          pip install -U poetry

      - name: Install system libraries
        run: sudo apt-get -y install libpq-dev gcc

      - name: Install dependencies
        working-directory: ./api-nei
        run: poetry install --no-interaction --no-root

      - name: Run tests (includes Alembic single-head, model-drift and ownership guards)
        working-directory: ./api-nei
        env:
          TEST_POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/postgres_test
        run: poetry run pytest

      - name: Type-check api-nei
        working-directory: ./api-nei
        run: poetry run mypy app
